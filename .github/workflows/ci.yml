name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered. GitHub evaluates `pull_request.branches` against the pull
  # request's BASE branch, and a stacked PR's base is a feature branch — so a `branches:
  # [main]` filter here means the gate silently runs on none of them. Measured on this
  # repo: heads e321066 and f2113e4 (both stacked at the time) have zero check runs, while
  # the same PR #69 gained its two checks the moment GitHub retargeted its base to main
  # (#85). Stacked branches are also where the risk is highest, because the base is
  # unmerged and nothing has compiled the reviewed diff on a clean runner. Do not restore
  # the filter as an optimisation: CI running on a stacked PR is the fix, not the cost.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`, and it is not an optimisation to undo. `actions/checkout@v4` defaults to
      # one commit, and `make verify` runs `testing/capture/manifest.py check`, which dates every
      # committed screenshot against the newest commit touching its page's sources. In a depth-1
      # checkout that question has no answer: the check either names the single visible commit for
      # everything or finds nothing at all, and both read as "these seven photographs are stale" on
      # a tree where every one of them may be current. Reproduced by the reviewer on
      # refs/pull/174/merge at depth 1, and it is the reason this job was red.
      #
      # The check now refuses a shallow checkout loudly instead of reporting drift, so a deleted
      # line here fails with a sentence about the fetch rather than seven about the screenshots.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # The same gate `make verify` runs locally: gofmt, vet, build, race tests,
      # and the zero-dependency guard. Nothing else is wired in here so the two
      # cannot drift apart.
      - name: Verify
        run: make verify

  # The shell that ships with the product: the installer runs as root and deletes
  # directories, and the two guards in scripts/ are what CI and every local gate lean on.
  # A quoting bug in install.sh is not a lint nit -- it is a `rm -rf` with an empty
  # variable.
  #
  # shellcheck is fetched at a pinned version and verified against its published digest
  # rather than run through a third-party action. An action would itself be unpinned code
  # executing on every PR to a repo whose whole subject is a root daemon, and pinning by
  # tag is not pinning. The digest is what makes the version tag mean something.
  #
  # Scope is the shipped scripts, by name, and it is deliberately not a repo-wide find:
  # .opencode/ holds agent tooling that is not installed anywhere and is written in bash
  # with POSIX-undefined builtins. Linting it here would only teach whoever reads the next
  # red tick that this job is noise.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.10.0
      SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch shellcheck at a pinned digest
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfL --retry 3 -o /tmp/sc.tar.xz "$url"
          echo "${SHELLCHECK_SHA256}  /tmp/sc.tar.xz" | sha256sum --check --status || {
            echo "the downloaded shellcheck does not match the pinned digest" >&2
            echo "refusing to run an unverified binary" >&2
            exit 1
          }
          tar -xf /tmp/sc.tar.xz -C /tmp
          "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version

      - name: Lint the shipped scripts
        run: |
          set -euo pipefail
          "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" \
            deploy/install.sh \
            deploy/run-dev.sh \
            deploy/packaging/deb/postinst \
            deploy/packaging/deb/prerm \
            deploy/packaging/deb/postrm \
            scripts/check-builds.sh \
            scripts/check-deps.sh \
            scripts/package.sh \
            scripts/package-lib.sh \
            scripts/package-deb.sh \
            scripts/package-rpm.sh \
            scripts/package-verify.sh \
            testing/e2e/e2e.sh \
            testing/e2e/forge-hint.sh \
            testing/e2e/lib.sh \
            testing/capture/fixture.sh \
            testing/capture/post-fixture.sh \
            testing/capture/pages-setup.sh \
            testing/capture/lock-setup.sh \
            testing/capture/testlock-setup.sh

  # Every file under scripts/mutations/ is a list of claims of the form "this guard is
  # tested, and here is the exact source text that would break if it were removed". Two
  # things can happen to such a claim and both look like a pass: the text no longer matches
  # the tree, so the mutant changes nothing (NOT APPLIED), or the replacement no longer
  # compiles, so nothing runs (INVALID). Neither fails a test. The battery prints a line for
  # each, and the tally still reads green.
  #
  # This has retired mutants repeatedly, by mechanisms nobody intended: a rename, an inserted
  # comment, gofmt realigning a composite literal, and resolving a merge conflict by taking one
  # file wholesale. Twice the damage reached `main` with CI green (#57 repaired six dead
  # rationale keys; rebasing #54 turned up six mutants that no longer applied), because
  # nothing in `make verify` reads these files at all.
  #
  # The checker is deliberately NOT folded into `make verify`, and its own docstring says so:
  # it compiles the tree once per mutant, minutes rather than seconds, and a gate that slow
  # is a gate people skip. A parallel job costs nobody any waiting, which is the same split
  # this repo already draws between `make verify` and `make mutate`.
  mutation-sets:
    name: mutation sets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The checker applies each mutant and compiles the package, so it needs a toolchain,
      # not just a parser. Same version as `verify`, so a set cannot be valid under one
      # compiler and stale under the other.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # Exits non-zero and names the set and the mutant id for each problem, so the red tick
      # says which claim to re-point rather than leaving it to be rediscovered by a battery.
      # The same target the Makefile documents, so "checking the sets" has one definition
      # and the self-test of the checker's own rules cannot be skipped here while running
      # locally. It checks the checker first, then every set in the tree.
      - name: Check every mutant still applies and compiles
        run: make check-mutations

  # The two package formats are built from one staged tree and then installed on two real
  # distributions that are not this runner, so that "the .deb and the .rpm contain the same
  # program in the same places" is a measured claim rather than a hope.
  #
  # This is the job that would have caught the first draft of the spec: rpm's install
  # post-processing stripped the ELF payload, so the .rpm's binary differed from the .deb's
  # at byte 41 -- identical build info, 1016 bytes of padding, two different hashes for one
  # release. Nothing that reads one package at a time can see that.
  #
  # It is a separate job rather than a step in `verify` because it pulls two distribution
  # images, and `verify` is the gate every developer runs on every save.
  packages:
    name: packages (${{ matrix.arch }})
    # The same two native runners the release workflow uses, and for the same reason (see the
    # comment in release.yml): rpm refuses to build for a foreign architecture at all, so an
    # x86_64 runner can build an aarch64 .deb but not its .rpm, and can never put either on a
    # machine that runs them. Before this, CI built amd64 only and the entire aarch64 path --
    # the rpm build, and the install gate on real arm64 Debian and Fedora -- ran for the first
    # time on a tag, which is the worst possible moment to discover it.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # A clean checkout of a tag is the release case; a clean checkout of a branch is the
      # development case and gets the 0.0.0+<sha> placeholder (scripts/package-lib.sh).
      - name: Build both formats
        run: scripts/package.sh --format all --arch ${{ matrix.arch }} --out dist

      # No --platform on the containers this step starts: on the arm64 runner, `debian:13` and
      # `fedora:43` resolve to their arm64 manifests, which is what makes this an arm64 install
      # gate rather than an amd64 one wearing an arm64 filename.
      - name: Install both, on machines that do not exist
        run: PACKAGE_VERIFY=1 scripts/package-verify.sh --deb dist/*.deb --rpm dist/*.rpm

      - name: Show what would be published
        run: cat dist/SHA256SUMS
