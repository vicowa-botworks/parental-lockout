name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # The same gate `make verify` runs locally: gofmt, vet, build, race tests,
      # and the zero-dependency guard. Nothing else is wired in here so the two
      # cannot drift apart.
      - name: Verify
        run: make verify
