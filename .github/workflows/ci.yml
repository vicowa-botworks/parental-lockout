name: CI

# A superseded push has to stop the run nobody will read, and this file is the only place that can
# say so: GitHub has no repository or organisation setting that cancels superseded runs, so without
# a group every push queues its own ~12-minute pass over the four legs below and finishes green on
# a head no reviewer can ever be shown -- a push dismisses the review and moves the head, so a
# verdict on a superseded SHA is worth nothing to anyone. Measured on PR #401 on 2026-11-16: four
# pushes to `issue-334` started four runs at once and three of them were cancelled by hand
# mid-flight, which is the automation this block is.
#
# The group is keyed per pull request, which keeps stacked PRs apart -- the same reason the
# `pull_request:` trigger below is deliberately unfiltered. `cancel-in-progress` is true only for a
# `pull_request` event, so a push to `main` and a `workflow_dispatch`ed debug run each land in a
# group of one (`run_id`) and no later PR push can cancel them. Cancelling is not erasing: a
# completed run stays attached to its SHA, and what gets stopped is an in-flight run of a head that
# no longer exists. `release.yml` carries no group at all and should keep not carrying one -- a
# cancelled half-published release is worse than a queue that makes someone wait.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  # Deliberately unfiltered. GitHub evaluates `pull_request.branches` against the pull
  # request's BASE branch, and a stacked PR's base is a feature branch — so a `branches:
  # [main]` filter here means the gate silently runs on none of them. Measured on this
  # repo: heads e321066 and f2113e4 (both stacked at the time) have zero check runs, while
  # the same PR #69 gained its two checks the moment GitHub retargeted its base to main
  # (#85). Stacked branches are also where the risk is highest, because the base is
  # unmerged and nothing has compiled the reviewed diff on a clean runner. Do not restore
  # the filter as an optimisation: CI running on a stacked PR is the fix, not the cost.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.10.0
      SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
    steps:
      # `fetch-depth: 0`, and it is not an optimisation to undo. `actions/checkout@v4` defaults to
      # one commit, and `make verify` runs `testing/capture/manifest.py check`, which dates every
      # committed screenshot against the newest commit touching its page's sources. In a depth-1
      # checkout that question has no answer: the check either names the single visible commit for
      # everything or finds nothing at all, and both read as "these seven photographs are stale" on
      # a tree where every one of them may be current. Reproduced by the reviewer on
      # refs/pull/174/merge at depth 1, and it is the reason this job was red.
      #
      # The check now refuses a shallow checkout loudly instead of reporting drift, so a deleted
      # line here fails with a sentence about the fetch rather than seven about the screenshots.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # `make verify` runs check-shell, and until this step that run used the runner's
      # stock shellcheck -- unpinned, so the verdict belonged to the runner image. On
      # 2026-11-18 the image rotated it from 0.9.0 to 0.11.0 inside a 34-minute window:
      # main read green at 08:42Z (`check-shell: 0.9.0` over 33 scripts) and a branch
      # beside it read red at 09:14Z on 0.11.0 -- eight SC2329 infos over fixture
      # functions the harness invokes by name through claim_leg, no content of either
      # tree involved. That is the pin-by-digest pattern below this job's own stated
      # reason for existing (H-0266): fetch the same digest the shellcheck job fetches
      # and hand it to make verify, so the version and the verdict are the repository's.
      - name: Fetch shellcheck at a pinned digest
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 180 -o /tmp/sc.tar.xz "$url"
          echo "${SHELLCHECK_SHA256}  /tmp/sc.tar.xz" | sha256sum --check --status || {
            echo "the downloaded shellcheck does not match the pinned digest" >&2
            echo "refusing to run an unverified binary" >&2
            exit 1
          }
          tar -xf /tmp/sc.tar.xz -C /tmp
          "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version

      # The second input on this job whose verdict the runner image owned, and the
      # same rotation window as the step above: the image move that carried shellcheck
      # 0.11.0 (H-0266) also moved `ubuntu-latest` from 24.04 to 26.04, and Ubuntu 26
      # split the backward-compatibility zone links out of tzdata into tzdata-legacy --
      # the 26.04 image's published apt table ships tzdata 2026e with no tzdata-legacy
      # line. `internal/schedule`'s bounds guard then did exactly what it was written
      # to do: refuse a partial system database, because a scan that measures a
      # fraction of the zones certifies bounds it never measured, and Enderbury is one
      # of the zones that deleted a calendar date -- the reason the three-day walk
      # exists. Measured: the green trunk run beside this branch's red one (`44269015134`
      # at `1292021`) printed `ok .../internal/schedule 140.636s` on `Image:
      # ubuntu-24.04` at 08:46Z, and this branch's verify job set up on
      # `Image: ubuntu-26.04` at 09:44Z FAILed six tests in that package with
      # `Pacific/Enderbury is missing from the system database` -- nothing in the tree
      # between the two runs caused it. Reproduced on a 26.04 box with the runner's
      # own debs: unpacked tzdata 2026e alone fails those six tests verbatim, and the
      # same tree with tzdata-legacy 2026e overlaid passes them. Pinning the job to
      # ubuntu-24.04 would only defer this: noble-updates carries the same split
      # (tzdata 2026e-0ubuntu0.24.04.1 ships no Enderbury either), so the next noble
      # image refresh reds the same way. So the database the bounds are certified
      # against belongs to the repository: fetch both halves of one pinned pair by
      # digest and replace the tree, so the scan's population is a number this file
      # states rather than one the image picks.
      - name: Install the pinned tz database
        env:
          TZDATA_VERSION: 2026e-0ubuntu0.26.04.1
          TZDATA_SHA256: 8859c96f6169bd81d6d4ec757929b9f92d56a0a906fde6fbd96f54bee476c742
          TZDATA_LEGACY_SHA256: 6fb2a6b78f428769023fdd55d576b80dc9199c176de225c49f0b54a5a8ff5908
        run: |
          set -euo pipefail
          # One hostname and `--retry 3` was the whole resilience of this fetch, and
          # neither half could reach the failure that actually came (#469): on 19 Nov
          # `tzdata_<version>_all.deb` served 0 bytes at 30 s from archive.ubuntu.com
          # -- intermittently, per object: a HEAD of the same object returned 200
          # minutes earlier, the sibling deb on the same host served normally the
          # whole time, and both debs on us.archive.ubuntu.com served bytes matching
          # the digests below -- while `--retry` spends nothing on a transport-level
          # reset. Fixture (rows A/B, curl 8.18.0): this step's old flags took a
          # mid-body RST at rc 56 on ONE connection, zero retries; adding
          # --retry-all-errors made the same call spend FOUR; an HTTP 503 retried
          # four ways under the old flags, so the retry machinery was live and the
          # error class is the whole story. So each half is now tried through a host
          # list behind the unchanged digest gate: the sha256 check is what decides a
          # fetch, not the hostname, so a fallback can only ever re-deliver the
          # pinned bytes. The step records which host served each half, so a future
          # red run names the degraded host instead of guessing one. What this
          # trades: if both hosts fully hang, the step burns its retries slowly
          # (worst case ~12 capped attempts per half) instead of dying fast -- red
          # for a real archive-wide outage is honest; red for one degraded hostname
          # is not.
          pool_hosts=(https://us.archive.ubuntu.com/ubuntu https://archive.ubuntu.com/ubuntu)
          fetch_pinned() { # fetch_pinned <out> <pool filename> -- first host that delivers wins
            local out=$1 name=$2 host rc=0
            for host in "${pool_hosts[@]}"; do
              if curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 \
                   --connect-timeout 10 --max-time 180 \
                   -o "$out" "$host/pool/main/t/tzdata/$name"; then
                echo "pinned fetch: $name served by $host"
                return 0
              else
                rc=$?
                echo "pinned fetch: $host failed for $name (curl exit $rc), trying the next host" >&2
                rm -f "$out"
              fi
            done
            echo "pinned fetch: no host served $name (last curl exit $rc)" >&2
            return 1
          }
          mkdir -p /tmp/tzdata && cd /tmp/tzdata
          fetch_pinned tzdata.deb "tzdata_${TZDATA_VERSION}_all.deb"
          fetch_pinned tzdata-legacy.deb "tzdata-legacy_${TZDATA_VERSION}_all.deb"
          echo "${TZDATA_SHA256}  tzdata.deb" | sha256sum --check --status || {
            echo "the downloaded tzdata does not match the pinned digest" >&2
            echo "refusing to certify bounds against an unverified database" >&2
            exit 1
          }
          echo "${TZDATA_LEGACY_SHA256}  tzdata-legacy.deb" | sha256sum --check --status || {
            echo "the downloaded tzdata-legacy does not match the pinned digest" >&2
            echo "refusing to certify bounds against an unverified database" >&2
            exit 1
          }
          for pkg in tzdata tzdata-legacy; do
            mkdir -p "x-$pkg"
            (cd "x-$pkg" && ar x "../$pkg.deb" && tar --zstd -xf data.tar.zst)
          done
          # Replace, do not overlay: the pinned legacy half over whatever tzdata the
          # image picked is the mixed-version shape the guard itself refuses.
          sudo rm -rf /usr/share/zoneinfo
          sudo cp -a x-tzdata/usr/share/zoneinfo /usr/share/zoneinfo
          sudo cp -a x-tzdata-legacy/usr/share/zoneinfo/. /usr/share/zoneinfo/
          # Say which database the scan downstream will measure, and prove both halves
          # really arrived -- a step that green-ticks having installed nothing is the
          # shape check-shell.sh already refuses for its own list. The version line is
          # the one inside the deb: the installed tree's +VERSION is written by the
          # package's postinst, and no postinst runs on an unpack.
          head -n1 /usr/share/zoneinfo/tzdata.zi
          test -e /usr/share/zoneinfo/Pacific/Kanton
          test -e /usr/share/zoneinfo/Pacific/Enderbury

      # The same gate `make verify` runs locally: gofmt, vet, build, race tests,
      # and the zero-dependency guard. Nothing else is wired in here so the two
      # cannot drift apart. SHELLCHECK names the binary fetched above, and
      # SHELLCHECK_REQUIRED keeps the honest skip honest: in this job a missing
      # shellcheck is a failure, because the fetch above is the one thing that
      # could have failed first and said so.
      - name: Verify
        run: make verify
        env:
          SHELLCHECK: /tmp/shellcheck-${{ env.SHELLCHECK_VERSION }}/shellcheck
          SHELLCHECK_REQUIRED: "1"

  # The shell that ships with the product: the installer runs as root and deletes
  # directories, and the two guards in scripts/ are what CI and every local gate lean on.
  # A quoting bug in install.sh is not a lint nit -- it is a `rm -rf` with an empty
  # variable.
  #
  # shellcheck is fetched at a pinned version and verified against its published digest
  # rather than run through a third-party action. An action would itself be unpinned code
  # executing on every PR to a repo whose whole subject is a root daemon, and pinning by
  # tag is not pinning. The digest is what makes the version tag mean something.
  #
  # Scope is the shipped scripts, by name, and it is deliberately not a repo-wide find:
  # .opencode/ holds agent tooling that is not installed anywhere and is written in bash
  # with POSIX-undefined builtins. Linting it here would only teach whoever reads the next
  # red tick that this job is noise.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.10.0
      SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch shellcheck at a pinned digest
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 180 -o /tmp/sc.tar.xz "$url"
          echo "${SHELLCHECK_SHA256}  /tmp/sc.tar.xz" | sha256sum --check --status || {
            echo "the downloaded shellcheck does not match the pinned digest" >&2
            echo "refusing to run an unverified binary" >&2
            exit 1
          }
          tar -xf /tmp/sc.tar.xz -C /tmp
          "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version

      - name: Lint the shipped scripts
        # The file list lives in scripts/check-shell.sh, not here. It used to be twelve names in
        # this step, which is a list that goes stale silently: the thirteenth script, added by the
        # next PR, is linted by nothing until someone remembers this step exists, and no check
        # fails when they don't. The script derives the set from `git ls-files`, and `make verify`
        # calls the same one, so the local gate and this job cannot disagree about what is shipped
        # (issue #189). The packaging branch that added this job's sibling also deleted twenty
        # names from the list below without deleting a single file from the set -- which is only
        # safe because the derivation covers extension-less scripts too; see the pathspec there.
        env:
          SHELLCHECK: /tmp/shellcheck-${{ env.SHELLCHECK_VERSION }}/shellcheck
          SHELLCHECK_REQUIRED: "1"
        run: make check-shell

  # Every file under scripts/mutations/ is a list of claims of the form "this guard is
  # tested, and here is the exact source text that would break if it were removed". Two
  # things can happen to such a claim and both look like a pass: the text no longer matches
  # the tree, so the mutant changes nothing (NOT APPLIED), or the replacement no longer
  # compiles, so nothing runs (INVALID). Neither fails a test. The battery prints a line for
  # each, and the tally still reads green.
  #
  # This has retired mutants repeatedly, by mechanisms nobody intended: a rename, an inserted
  # comment, gofmt realigning a composite literal, and resolving a merge conflict by taking one
  # file wholesale. Twice the damage reached `main` with CI green (#57 repaired six dead
  # rationale keys; rebasing #54 turned up six mutants that no longer applied), because
  # nothing in `make verify` reads these files at all.
  #
  # The checker is deliberately NOT folded into `make verify`, and its own docstring says so:
  # it compiles the tree once per mutant, minutes rather than seconds, and a gate that slow
  # is a gate people skip. A parallel job costs nobody any waiting, which is the same split
  # this repo already draws between `make verify` and `make mutate`.
  mutation-sets:
    name: mutation sets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The checker applies each mutant and compiles the package, so it needs a toolchain,
      # not just a parser. Same version as `verify`, so a set cannot be valid under one
      # compiler and stale under the other.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # Exits non-zero and names the set and the mutant id for each problem, so the red tick
      # says which claim to re-point rather than leaving it to be rediscovered by a battery.
      # The same target the Makefile documents, so "checking the sets" has one definition
      # and the self-test of the checker's own rules cannot be skipped here while running
      # locally. It checks the checker first, then every set in the tree.
      - name: Check every mutant still applies and compiles
        run: make check-mutations

  # The two package formats are built from one staged tree and then installed on two real
  # distributions that are not this runner, so that "the .deb and the .rpm contain the same
  # program in the same places" is a measured claim rather than a hope.
  #
  # This is the job that would have caught the first draft of the spec: rpm's install
  # post-processing stripped the ELF payload, so the .rpm's binary differed from the .deb's
  # at byte 41 -- identical build info, 1016 bytes of padding, two different hashes for one
  # release. Nothing that reads one package at a time can see that.
  #
  # It is a separate job rather than a step in `verify` because it pulls two distribution
  # images, and `verify` is the gate every developer runs on every save.
  packages:
    name: packages (${{ matrix.arch }})
    # The same two native runners the release workflow uses, and for the same reason (see the
    # comment in release.yml): rpm refuses to build for a foreign architecture at all, so an
    # x86_64 runner can build an aarch64 .deb but not its .rpm, and can never put either on a
    # machine that runs them. Before this, CI built amd64 only and the entire aarch64 path --
    # the rpm build, and the install gate on real arm64 Debian and Fedora -- ran for the first
    # time on a tag, which is the worst possible moment to discover it.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # A clean checkout of a tag is the release case; a clean checkout of a branch is the
      # development case and gets the 0.0.0+<sha> placeholder (scripts/package-lib.sh).
      - name: Build both formats
        run: scripts/package.sh --format all --arch ${{ matrix.arch }} --out dist

      # No --platform on the containers this step starts: on the arm64 runner, `debian:13` and
      # `fedora:43` resolve to their arm64 manifests, which is what makes this an arm64 install
      # gate rather than an amd64 one wearing an arm64 filename.
      - name: Install both, on machines that do not exist
        run: PACKAGE_VERIFY=1 scripts/package-verify.sh --deb dist/*.deb --rpm dist/*.rpm

      - name: Show what would be published
        run: cat dist/SHA256SUMS
